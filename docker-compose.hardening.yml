# docker-compose.hardening.yml — OPT-IN Docker socket hardening (finding H1).
#
# WHY: the base compose mounts /var/run/docker.sock read-write into converter-hub
# (and watchtower). That mount means any RCE or auth bypass in the web app is
# effectively root on the Docker host. This overlay puts a least-privilege API
# proxy (tecnativa/docker-socket-proxy) in front of the socket and points the hub
# at it, so a hub compromise can only reach the handful of Docker API groups it
# actually needs (create/monitor job containers), not the whole daemon.
#
# APPLY:
#   docker compose -f docker-compose.yml -f docker-compose.hardening.yml up -d
#
# ONE-TIME MANUAL STEP (required): compose can only ADD to a service's `volumes`
# list, never remove an entry. So you must also comment out the direct
#     - /var/run/docker.sock:/var/run/docker.sock
# line under converter-hub in docker-compose.yml, otherwise the hub still has the
# raw socket and the proxy achieves nothing. (Search that file for "docker.sock".)
#
# WATCHTOWER: it also holds the raw socket to auto-restart updated containers.
# The safest posture is to run it only when you actually want to pull updates, or
# to remove it and update manually. If you keep it, be aware it remains a
# host-root-capable component; pin its image to a digest and treat it as trusted.

services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-socket-proxy
    restart: unless-stopped
    # Reads the socket and re-exposes a filtered TCP API on :2375 to the compose
    # network only (no host port published).
    privileged: true
    environment:
      # Allow ONLY what the hub needs. 1 = allow, 0 = deny (denied by default).
      CONTAINERS: "1"   # list/create/start/stop/inspect job containers
      IMAGES: "1"       # resolve / pull converter images
      POST: "1"         # required for create/start/stop (mutating calls)
      # Explicitly denied for clarity — shrink the blast radius:
      NETWORKS: "0"
      VOLUMES: "0"
      EXEC: "0"
      SECRETS: "0"
      CONFIGS: "0"
      SWARM: "0"
      NODES: "0"
      SERVICES: "0"
      SYSTEM: "0"
      INFO: "0"
      AUTH: "0"
      PLUGINS: "0"
      DISTRIBUTION: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - default

  converter-hub:
    # Route the Docker SDK (docker.from_env()) through the proxy instead of the
    # raw socket. Remember to comment out the raw socket volume in the base file.
    environment:
      DOCKER_HOST: "tcp://docker-socket-proxy:2375"
    depends_on:
      - docker-socket-proxy
