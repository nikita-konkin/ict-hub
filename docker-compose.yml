# ── Services ──────────────────────────────────────────────────────────────────
services:

  # The ConverterHub web application
  converter-hub:
    build:
      context: .
      dockerfile: Dockerfile

    # Local `docker compose build` tags the image under this name; on a
    # machine with no source checked out, `docker compose pull` fetches it
    # from Docker Hub instead. Override the tag with IMAGE_TAG in .env.
    image: nikitaikonkin/ict-hub-converter:${IMAGE_TAG:-latest}

    container_name: converter-hub

    restart: unless-stopped

    # Opt in to auto-updates by the watchtower service below (which is scoped
    # to labeled containers only, so it never touches the job containers this
    # service spawns dynamically via the Docker socket).
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

    ports:
      # Map host port CONVERTER_HUB_HOST_PORT (default 8080) → container port 8000.
      # Override in .env if 8080 is already taken on this host.
      - "${CONVERTER_HUB_HOST_PORT:-8080}:8000"

    # Load environment variables from local .env file (and allow users to add
    # extra variables without editing docker-compose.yml).
    env_file:
      - .env

    environment:
      # Prevent runtime proxy interception for container-to-container traffic.
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      NO_PROXY: "localhost,127.0.0.1,data-indexer,converter-hub,tec-backend,host.docker.internal"
      http_proxy: ""
      https_proxy: ""
      no_proxy: "localhost,127.0.0.1,data-indexer,converter-hub,tec-backend,host.docker.internal"

      # ── Security (CHANGE THESE before exposing to a network) ──────────────
      SECRET_KEY: ${SECRET_KEY:-replace-me-with-a-random-32-char-string!!}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}           # password for the first-boot 'admin' user

      # ── Database ─────────────────────────────────────────────────────────
      # IMPORTANT: don't read DATABASE_URL from a host .env, otherwise Docker runs
      # can accidentally write the SQLite DB into the container layer (e.g. /app/dev.db),
      # ballooning container size. Use CONVERTER_HUB_DATABASE_URL to override.
      DATABASE_URL: ${CONVERTER_HUB_DATABASE_URL:-sqlite:////app/data/converter_hub.db}

      # ── Converter images ─────────────────────────────────────────────────
      # Must match an image name available on this Docker host (pulled from
      # Docker Hub in production, or built locally with "docker compose build"
      # in ../tec-suite for local dev).
      TECSUITE_IMAGE: ${TECSUITE_IMAGE:-nikitaikonkin/tec-suite:latest}
      # Host path containing YYYY_original/DDD/*.zip data for TEC-suite.
      # Example (Windows): F:\\MyData\\ND\\Server
      RINEX_DATA_PATH_HOST: ${RINEX_DATA_PATH_HOST:-}
      # Container path used by converter-hub to browse server folder structure.
      RINEX_DATA_PATH_CONTAINER: ${RINEX_DATA_PATH_CONTAINER:-/mnt/rinex-server}
      # Host folder to persist TEC-suite output and its container mount path.
      TECSUITE_OUT_DAT_DATA_PATH_HOST: ${TECSUITE_OUT_DAT_DATA_PATH_HOST:-}
      TECSUITE_OUT_DAT_DATA_PATH: ${TECSUITE_OUT_DAT_DATA_PATH:-/app/out}
      # Container path used by converter-hub to browse TEC DAT output folders.
      TECSUITE_OUT_DAT_DATA_PATH_CONTAINER: ${TECSUITE_OUT_DAT_DATA_PATH_CONTAINER:-/mnt/tecsuite-out}
      DAT_PARQUET_IMAGE: ${DAT_PARQUET_IMAGE:-nikitaikonkin/dat-parquet-handler:latest}
      ABSTEC_SUITE_IMAGE: ${ABSTEC_SUITE_IMAGE:-nikitaikonkin/abstec-suite:latest}
      ABSTEC_OUTPUT_DATA_PATH_HOST: ${ABSTEC_OUTPUT_DATA_PATH_HOST:-}
      ABSTEC_OUTPUT_DATA_PATH: ${ABSTEC_OUTPUT_DATA_PATH:-/app/abstec_out}
      ABSTEC_OUTPUT_DATA_PATH_CONTAINER: ${ABSTEC_OUTPUT_DATA_PATH_CONTAINER:-/mnt/abstec-out}
      # ── AbsTEC dockur XP runner (optional) ───────────────────────────────
      # Host path of abstec-suite/dockur/jobs — the job queue shared with the
      # Windows XP VM (abstec-xp mounts it as /shared/jobs). Leave empty to
      # keep the "dockur" runner option disabled.
      ABSTEC_DOCKUR_JOBS_PATH_HOST: ${ABSTEC_DOCKUR_JOBS_PATH_HOST:-}
      # Optional DAT input path as seen from inside the XP guest (default W:\in\).
      ABSTEC_DOCKUR_GUEST_DAT_PATH: ${ABSTEC_DOCKUR_GUEST_DAT_PATH:-}
      # Name of the XP VM container; the hub auto-starts it if it is stopped
      # when a dockur job is submitted.
      ABSTEC_DOCKUR_VM_CONTAINER: ${ABSTEC_DOCKUR_VM_CONTAINER:-abstec-xp}
      # ── DAT <-> Parquet output persistence ───────────────────────────────
      PARQUET_OUTPUT_TECSUITE_DATA_PATH_HOST: ${PARQUET_OUTPUT_TECSUITE_DATA_PATH_HOST:-}
      PARQUET_OUTPUT_TECSUITE_DATA_PATH: ${PARQUET_OUTPUT_TECSUITE_DATA_PATH:-/app/tecsuite_parquet_out}
      PARQUET_OUTPUT_TECSUITE_DATA_PATH_CONTAINER: ${PARQUET_OUTPUT_TECSUITE_DATA_PATH_CONTAINER:-/mnt/tecsuite-parquet-out}
      PARQUET_OUTPUT_ABSTEC_DATA_PATH_HOST: ${PARQUET_OUTPUT_ABSTEC_DATA_PATH_HOST:-}
      PARQUET_OUTPUT_ABSTEC_DATA_PATH: ${PARQUET_OUTPUT_ABSTEC_DATA_PATH:-/app/abstec_parquet_out}
      PARQUET_OUTPUT_ABSTEC_DATA_PATH_CONTAINER: ${PARQUET_OUTPUT_ABSTEC_DATA_PATH_CONTAINER:-/mnt/abstec-parquet-out}

      # ── TEC Map basemap (HTTP XYZ tile server) ───────────────────────────
      # URL template with {z}/{x}/{y} placeholders. Example for a local
      # overv/openstreetmap-tile-server on the Docker host port 8090:
      #   http://host.docker.internal:8090/tile/{z}/{x}/{y}.png
      # Leave empty in .env to disable the "XYZ tile server (HTTP)" option.
      TEC_MAP_BASEMAP_TILE_SERVER_URL: ${TEC_MAP_BASEMAP_TILE_SERVER_URL:-}

      # ── Data Indexer Service ─────────────────────────────────────────────
      DATA_INDEXER_URL: ${DATA_INDEXER_URL:-http://data-indexer:5001}
      DATA_INDEXER_TIMEOUT_SEC: ${DATA_INDEXER_TIMEOUT_SEC:-120}

      # ── External data-analysis API (TEC backend) ───────────────────────
      # Example when analysis service is another compose service:
      # ANALYSIS_API_BASE_URL: "http://tec-backend:8000"
      # If TEC backend runs on the Docker host machine, use host.docker.internal
      # (localhost inside this container points to converter-hub itself).
      ANALYSIS_API_BASE_URL: ${ANALYSIS_API_BASE_URL:-http://host.docker.internal:8000}
      ANALYSIS_API_TIMEOUT_SEC: ${ANALYSIS_API_TIMEOUT_SEC:-45}

    volumes:
      # Mount RINEX host data into converter-hub so UI can discover years/days.
      - ${RINEX_DATA_PATH_HOST}:${RINEX_DATA_PATH_CONTAINER:-/mnt/rinex-server}:ro
      # Mount TEC DAT output into converter-hub so AbsTEC selectors can discover year/day/site.
      - ${TECSUITE_OUT_DAT_DATA_PATH_HOST}:${TECSUITE_OUT_DAT_DATA_PATH_CONTAINER:-/mnt/tecsuite-out}:ro
      # Mount AbsTEC output into converter-hub for year/day/site browsing.
      - ${ABSTEC_OUTPUT_DATA_PATH_HOST}:${ABSTEC_OUTPUT_DATA_PATH_CONTAINER:-/mnt/abstec-out}:ro
      # Mount DAT <-> Parquet output directories for future browsing support.
      - ${PARQUET_OUTPUT_TECSUITE_DATA_PATH_HOST}:${PARQUET_OUTPUT_TECSUITE_DATA_PATH_CONTAINER:-/mnt/tecsuite-parquet-out}:ro
      - ${PARQUET_OUTPUT_ABSTEC_DATA_PATH_HOST}:${PARQUET_OUTPUT_ABSTEC_DATA_PATH_CONTAINER:-/mnt/abstec-parquet-out}:ro

      # ── Docker socket (REQUIRED) ─────────────────────────────────────────
      # Mounting the socket lets this container start/stop/inspect other
      # containers on the same Docker host. On Windows with Docker Desktop
      # the socket path is the same as on Linux (Docker Desktop provides a
      # Linux VM and exposes the standard Unix socket path).
      - /var/run/docker.sock:/var/run/docker.sock

      # ── Persistent database storage ───────────────────────────────────────
      # All job records and user accounts are stored in SQLite inside this
      # named volume. The volume persists across `docker-compose down` and
      # `docker-compose up` cycles. Run `docker volume rm converter-hub_db`
      # to wipe it completely.
      - db:/app/data

    # Linux support for host.docker.internal when analysis backend is exposed on host port.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # ── Resource limits ───────────────────────────────────────────────────
    # TEC-map rendering loads per-day GNSS dataframes (~0.5 GB peak for a
    # 10-station day) and renders hundreds of matplotlib frames, so the old
    # 1G limit caused OOM kills on multi-day GIF requests. Adjust freely.
    deploy:
      resources:
        limits:
          memory: 4G

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/login')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Data Indexer Service - provides XML indexing for all data types
  data-indexer:
    build:
      context: ./data-indexer
      dockerfile: Dockerfile

    image: nikitaikonkin/ict-hub-data-indexer:${IMAGE_TAG:-latest}

    container_name: data-indexer

    restart: unless-stopped

    labels:
      - "com.centurylinklabs.watchtower.enable=true"

    ports:
      # Map host port 5001 → container port 5001
      - "5001:5001"

    # Load environment variables from local .env file (and allow users to add
    # extra variables without editing docker-compose.yml).
    env_file:
      - .env

    environment:
      # Prevent runtime proxy interception for container-to-container traffic.
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      NO_PROXY: "localhost,127.0.0.1,data-indexer,converter-hub,tec-backend,host.docker.internal"
      http_proxy: ""
      https_proxy: ""
      no_proxy: "localhost,127.0.0.1,data-indexer,converter-hub,tec-backend,host.docker.internal"

      # ── Data Indexer Paths ───────────────────────────────────────────────
      # Container paths used by the data-indexer service API defaults
      INDEXER_RINEX_DATA_PATH_CONTAINER: ${INDEXER_RINEX_DATA_PATH_CONTAINER:-/mnt/rinex-server}
      INDEXER_TECSUITE_OUT_DAT_DATA_PATH_CONTAINER: ${INDEXER_TECSUITE_OUT_DAT_DATA_PATH_CONTAINER:-/mnt/tecsuite-out}
      INDEXER_ABSTEC_OUTPUT_DATA_PATH_CONTAINER: ${INDEXER_ABSTEC_OUTPUT_DATA_PATH_CONTAINER:-/mnt/abstec-out}
      INDEXER_PARQUET_OUTPUT_TECSUITE_DATA_PATH_CONTAINER: ${INDEXER_PARQUET_OUTPUT_TECSUITE_DATA_PATH_CONTAINER:-/mnt/tecsuite-parquet-out}
      INDEXER_PARQUET_OUTPUT_ABSTEC_DATA_PATH_CONTAINER: ${INDEXER_PARQUET_OUTPUT_ABSTEC_DATA_PATH_CONTAINER:-/mnt/abstec-parquet-out}

      # ── Data Indexer Configuration ───────────────────────────────────────
      DATA_INDEXER_CACHE_TTL_SEC: ${DATA_INDEXER_CACHE_TTL_SEC:-300.0}
      DATA_INDEXER_CACHE_DB_PATH: ${DATA_INDEXER_CACHE_DB_PATH:-/app/data/cache.db}
      # Options: false (default), true/async (non-blocking), sync (blocking, requires rebuild)
      DATA_INDEXER_RUN_ON_STARTUP: ${DATA_INDEXER_RUN_ON_STARTUP:-false}
      # Optional: disable watchers to avoid Linux inotify limits on very large trees.
      DATA_INDEXER_WATCHERS_ENABLED: ${DATA_INDEXER_WATCHERS_ENABLED:-true}
      # Optional: cap scanning for very large datasets (0 = unlimited).
      DATA_INDEXER_MAX_YEARS: ${DATA_INDEXER_MAX_YEARS:-0}

    volumes:
      # Mount data volumes for indexing (reuse the same host paths as converter-hub)
      - ${RINEX_DATA_PATH_HOST}:${INDEXER_RINEX_DATA_PATH_CONTAINER:-/mnt/rinex-server}:ro
      - ${TECSUITE_OUT_DAT_DATA_PATH_HOST}:${INDEXER_TECSUITE_OUT_DAT_DATA_PATH_CONTAINER:-/mnt/tecsuite-out}:ro
      - ${ABSTEC_OUTPUT_DATA_PATH_HOST}:${INDEXER_ABSTEC_OUTPUT_DATA_PATH_CONTAINER:-/mnt/abstec-out}:ro
      - ${PARQUET_OUTPUT_TECSUITE_DATA_PATH_HOST}:${INDEXER_PARQUET_OUTPUT_TECSUITE_DATA_PATH_CONTAINER:-/mnt/tecsuite-parquet-out}:ro
      - ${PARQUET_OUTPUT_ABSTEC_DATA_PATH_HOST}:${INDEXER_PARQUET_OUTPUT_ABSTEC_DATA_PATH_CONTAINER:-/mnt/abstec-parquet-out}:ro
      # Mount cache database volume to persist cache across container restarts
      - data-indexer-cache:/app/data

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Watchtower — polls Docker Hub and auto-updates/restarts labeled
  # containers when CI pushes a new image (see .github/workflows/ci-cd.yml in
  # each repo). Scoped to WATCHTOWER_LABEL_ENABLE so it only ever touches
  # containers explicitly opted in via com.centurylinklabs.watchtower.enable
  # — it must never manage the tec-suite/dat-parquet-handler/abstec-suite job
  # containers converter-hub spawns on demand through the Docker socket.
  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # containrrr/watchtower's bundled Docker client SDK defaults to an old
      # API version that newer Docker Engines reject ("client version 1.25 is
      # too old"). Force a modern version so it negotiates correctly.
      DOCKER_API_VERSION: "1.41"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: ${WATCHTOWER_POLL_INTERVAL:-300}

# ── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  db:
    driver: local
    # Uncomment and set a host path if you want the DB at a specific location:
    # driver_opts:
    #   type: none
    #   o: bind
    #   device: C:\converter-hub\data  # Windows example
  data-indexer-cache:
    driver: local
    # Uncomment and set a host path to persist cache across container rebuilds:
    # driver_opts:
    #   type: none
    #   o: bind
    #   device: C:\converter-hub\data-indexer-cache  # Windows example
