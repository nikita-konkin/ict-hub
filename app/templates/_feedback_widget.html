<button class="feedback-fab" type="button" onclick="window.__chOpenFeedback && window.__chOpenFeedback()">
  {{ t('feedback_button') }}
</button>

<div id="feedback-modal" class="feedback-modal" aria-hidden="true" role="dialog" aria-label="{{ t('feedback_title') }}">
  <div class="feedback-backdrop" onclick="window.__chCloseFeedback && window.__chCloseFeedback()"></div>
  <div class="feedback-card">
    <div class="feedback-head">
      <div class="feedback-title">{{ t('feedback_title') }}</div>
      <button class="btn btn-ghost" type="button" onclick="window.__chCloseFeedback && window.__chCloseFeedback()" style="padding:6px 10px; font-size:11px;">
        {{ t('feedback_cancel') }}
      </button>
    </div>

    <form
      method="POST"
      action="/feedback"
      hx-post="/feedback"
      hx-target="#feedback-result"
      hx-swap="innerHTML"
      style="margin-top:12px;"
    >
      <input type="hidden" name="page_url" value="{{ request.url }}">

      <div class="form-group" style="margin-bottom:12px;">
        <label class="form-label" for="fb-category">{{ t('feedback_type') }}</label>
        <select class="form-select" id="fb-category" name="category">
          <option value="feedback" selected>{{ t('feedback_type_feedback') }}</option>
          <option value="bug">{{ t('feedback_type_bug') }}</option>
          <option value="idea">{{ t('feedback_type_idea') }}</option>
          <option value="content">{{ t('feedback_type_content') }}</option>
          <option value="question">{{ t('feedback_type_question') }}</option>
        </select>
      </div>

      <div class="form-group" style="margin-bottom:12px;">
        <label class="form-label" for="fb-message">{{ t('feedback_message') }} <span class="required">*</span></label>
        <textarea class="form-textarea" id="fb-message" name="message" rows="5" maxlength="4000" required
                  placeholder="{{ t('feedback_placeholder') }}"></textarea>
      </div>

      <div id="feedback-result" style="margin-bottom:12px;"></div>

      <div style="display:flex; gap:10px; justify-content:flex-end;">
        <button type="button" class="btn btn-ghost" onclick="window.__chCloseFeedback && window.__chCloseFeedback()">
          {{ t('feedback_cancel') }}
        </button>
        <button type="submit" class="btn btn-primary">
          {{ t('feedback_send') }}
        </button>
      </div>
    </form>
  </div>
</div>

<script src="/static/js/feedback-widget.js"></script>
