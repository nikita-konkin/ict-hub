name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-test.txt

      - name: Run tests
        run: pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: ruff
        run: |
          ruff check .
          ruff format --check .

      - name: mypy
        run: mypy

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: ESLint
        run: |
          npm ci
          npm run lint

  data-indexer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r data-indexer/requirements.txt pytest==8.3.4 mypy==2.3.1

      - name: mypy
        run: mypy --python-version 3.11 data-indexer/app.py data-indexer/data_indexer.py data-indexer/rinex_station_map.py

      - name: Run tests
        working-directory: data-indexer
        run: pytest

  build-and-push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push converter-hub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            nikitaikonkin/ict-hub-converter:latest
            nikitaikonkin/ict-hub-converter:${{ github.sha }}

      - name: Build and push data-indexer
        uses: docker/build-push-action@v6
        with:
          context: ./data-indexer
          file: ./data-indexer/Dockerfile
          push: true
          tags: |
            nikitaikonkin/ict-hub-data-indexer:latest
            nikitaikonkin/ict-hub-data-indexer:${{ github.sha }}
