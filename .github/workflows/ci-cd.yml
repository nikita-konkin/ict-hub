name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-test.txt

      - name: Run tests
        run: pytest

  build-and-push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push converter-hub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            nikitaikonkin/ict-hub-converter:latest
            nikitaikonkin/ict-hub-converter:${{ github.sha }}

      - name: Build and push data-indexer
        uses: docker/build-push-action@v6
        with:
          context: ./data-indexer
          file: ./data-indexer/Dockerfile
          push: true
          tags: |
            nikitaikonkin/ict-hub-data-indexer:latest
            nikitaikonkin/ict-hub-data-indexer:${{ github.sha }}
