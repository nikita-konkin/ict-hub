# Tool configuration only; the services are not packaged (see the Dockerfiles).
# Lint/format/type-check commands are listed in README.md ("Linting").

[tool.ruff]
# The hub image runs 3.12, the data-indexer image 3.11: keep code valid on both.
target-version = "py311"
line-length = 120
src = [".", "data-indexer"]
extend-exclude = [
    # One-off probe scripts run by hand inside the containers, not part of the services.
    "test_results.py",
    "test_rinex.py",
    "test_rinex_simple.py",
    "tmp_container_probe*.py",
]

[tool.ruff.format]
# Leave code examples in the docs as written.
exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import order
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "C4",       # comprehensions
    "PIE",
    "RUF",
    "S",        # bandit (security)
    "PT",       # pytest style
    "ASYNC",
    "LOG",
    "G",        # logging format: pass arguments, not f-strings
]
ignore = [
    # The UI is bilingual: Cyrillic letters and typographic characters (—, ×, …)
    # in strings, docstrings and comments are intentional.
    "RUF001", "RUF002", "RUF003",
    # Line length is the formatter's job; what it leaves long are string literals
    # (API parameter descriptions, messages), which read better unsplit.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",          # assert is how pytest checks
    "S105", "S106",  # fixed test passwords
    "S108",          # /tmp paths as fake data roots
    "S314",          # parsing XML the tests built themselves
]
"data-indexer/test_*.py" = ["S101", "S108"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares dependencies and parameters with calls in default arguments.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Form", "fastapi.Path",
    "fastapi.Body", "fastapi.Header", "fastapi.Cookie", "fastapi.File",
    # Dependency factories: Depends(require_page_access("analysis")).
    "app.auth.require_page_access", "app.auth.require_converter_access",
]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
# data-indexer has its own top-level "app" module, so it is checked in a
# separate run (see README.md) rather than listed here.
files = ["app"]

[[tool.mypy.overrides]]
# No type information published for these.
module = [
    "dicttoxml",
    "pandas", "pandas.*",
    "scipy", "scipy.*",
    "plotly", "plotly.*", "_plotly_utils.*",
    "pyarrow", "pyarrow.*",
    "PyIRI", "PyIRI.*",
]
ignore_missing_imports = true
